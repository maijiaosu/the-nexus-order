name: build-installers

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: electron/package-lock.json
      - name: Prepare the frozen web payload
        run: Copy-Item -Recurse web electron\app
      - name: Build the Windows x64 installer
        working-directory: electron
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: |
          npm ci
          npx electron-builder --win nsis --x64 --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: electron/release/*.exe
          if-no-files-found: error
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Prepare the frozen web payload
        run: |
          mkdir -p android/app/src/main/assets
          cp -R web android/app/src/main/assets/www
      - name: Restore the existing signing identity
        env:
          NEXUS_JKS_B64: ${{ secrets.NEXUS_JKS_B64 }}
        run: |
          mkdir -p "$RUNNER_TEMP/nexus-signing"
          printf '%s' "$NEXUS_JKS_B64" | base64 -d > "$RUNNER_TEMP/nexus-signing/nexus.jks"
      - name: Build the Android installer
        working-directory: android
        env:
          NEXUS_KEYSTORE_PATH: ${{ runner.temp }}/nexus-signing/nexus.jks
          NEXUS_KEYSTORE_PASSWORD: ${{ secrets.NEXUS_KEYSTORE_PASSWORD }}
          NEXUS_KEY_ALIAS: ${{ secrets.NEXUS_KEY_ALIAS }}
          NEXUS_KEY_PASSWORD: ${{ secrets.NEXUS_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: android-installer
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
      - name: Remove temporary signing material
        if: always()
        run: rm -rf "$RUNNER_TEMP/nexus-signing"
