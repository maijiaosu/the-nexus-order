-made, based on official Indonesian Government Image","license":"Public domain","licenseUrl":"","usageTerms":"Public domain","attributionRequired":"false","copyrighted":"False","commonsSHA1":"7f91a7a6fc7d308fc0f8539ffc054f17e0d05027","sha256":"bb0cc43a54c76de86d8aa361bfd3ca954180c583f49dd5a2f63ec5f18f4022cc","byteLength":248379,"width":500,"height":537,"modifications":[],"notes":["Wikimedia original download returned HTTP 429 with guidance to use standard thumbnail widths; unmodified 500px Commons-rendered PNG preserved."],"description":"State emblem of Indonesia is called Garuda Pancasila. The main part of the coat of arms is the golden mythical bird Garuda with a shield on its chest and a scroll gripped by its leg bears the national motto: \"Bhinneka Tunggal Ika\", roughly means \"Unity in Diversity\". The shield's five emblems represent Pancasila, the five principles of Indonesia's national philosophy. The numbers of feathers was meant to symbolize the date of Indonesian Proclamation of Independence; 17 feathers on each wings, 8 tail feathers, 19 upper tail feathers (under the shield, above the tail), and 45 neck feathers; all symbolize 17-8-1945; 17th August 1945. Garuda Pancasila was designed by Sultan Hamid II of Pontianak, and was adopted as national coat of arms on February 11, 1950.","attributionHtml":"","commonsRestrictions":"insignia","visualInspection":"Rendered and visually inspected in a 33-country contact sheet on 2026-11-03; recognizable national emblem/flag, no broken or cropped render."},"PAK":{"file":"assets/PAK.png","kind":"national-emblem","source":"https://commons.wikimedia.org/wiki/File:State_emblem_of_Pakistan.svg","downloadUrl":"https://thumb.wikimedia.org/wikipedia/commons/thumb/e/ef/State_emblem_of_Pakistan.svg/500px-State_emblem_of_Pakistan.svg.png?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail","originalUrl":"https://upload.wikimedia.org/wikipedia/commons/e/ef/State_emblem_of_Pakistan.svg?utm_source=commons
