plugins {
    id 'com.android.application'
}

android {
    namespace 'com.maijiaosu.thenexusorder'
    compileSdk 34

    defaultConfig {
        applicationId "com.maijiaosu.thenexusorder"
        minSdk 24
        targetSdk 34
        versionCode 2
        versionName "0.2.0"
    }

    signingConfigs {
        release {
            storeFile file('keystore/nexus.jks')
            storePassword 'nexus2026'
            keyAlias 'nexus'
            keyPassword 'nexus2026'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
