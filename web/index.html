<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Nexus Order · 世界沙盘</title>
<link rel="stylesheet" href="assets/fonts.css">
<style>
:root{
  --bg:#090c10; --bg2:#0b0f14; --panel:#0d1218; --line:#1b2830; --line2:#33505e;
  --steel:#5b8296; --steelhi:#8fb8cb;
  --txt:#d8cfae; --dim:#8f8a74; --faint:#5d5947;
  --gold:#c9a84c; --goldhi:#e3c565;
  --paper:#ddd2b0; --paperln:#8f8464; --ink:#2b2620;
  --r-ally:#4e708c; --r-good:#5d7f4e; --r-tense:#b08a2a; --r-war:#a63d2e;
  --sans:"TNO Sans",-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
  --serif:"TNO Serif","Songti SC","STSong","Noto Serif SC",serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,"Courier New",monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);color:var(--txt);font-family:var(--sans);font-size:13px;line-height:1.45;overflow:hidden}
button{font-family:inherit;color:inherit;background:none;border:none;cursor:pointer}
a{color:inherit}
#app{position:relative;width:100%;height:100%;display:flex;flex-direction:column;background:var(--bg)}

/* ===== 顶栏 ===== */
#topbar{position:relative;z-index:30;display:flex;align-items:center;gap:14px;flex-wrap:wrap;
  padding:10px 14px;padding-inline-end:var(--daimon-widget-host-safe-inline-end,82px);
  padding-block-start:calc(8px + var(--daimon-widget-host-safe-block-start,0px));
  border-bottom:1px solid var(--line2);background:linear-gradient(180deg,rgba(13,18,24,.97),rgba(9,12,16,.94));}
.brand{display:flex;align-items:center;gap:9px;font-family:var(--serif);font-size:14px;letter-spacing:3px;color:var(--txt)}
.brand .dot{width:7px;height:7px;background:var(--gold);transform:rotate(45deg);animation:pulse 3.2s infinite}
.brand .ver{color:var(--dim);font-size:10px;letter-spacing:3px;font-family:var(--mono)}
.modes{display:flex;gap:2px;border:1px solid var(--line2);padding:2px;background:rgba(13,18,24,.6)}
.modes button{font-family:var(--mono);font-size:11px;letter-spacing:1px;padding:5px 10px;color:var(--dim);border:1px solid transparent}
.modes button:hover{color:var(--txt)}
.modes button.on{color:var(--steelhi);background:#16222b;border-color:var(--steel);text-shadow:none}
.modes button:focus-visible{outline:1px solid var(--steel);outline-offset:1px}
#meta{margin-left:auto;display:flex;gap:14px;font-family:var(--mono);font-size:10px;color:var(--faint);letter-spacing:.5px}
#meta b{color:var(--dim);font-weight:400}
#meta .live{color:var(--steelhi)}
#meta .stale{color:var(--gold)}
#modeind{color:var(--gold)}

/* ===== 地图区 ===== */
#mapwrap{position:relative;flex:1;min-height:0;background:var(--bg)}
#map{position:absolute;inset:0;z-index:1}
.vignette{position:absolute;inset:0;pointer-events:none;z-index:6;
  background:radial-gradient(ellipse at 50% 45%,transparent 58%,rgba(0,0,0,.62) 100%);}

/* ===== 图例 ===== */
#legend{position:absolute;z-index:20;right:12px;bottom:44px;display:none;flex-direction:column;gap:3px;
  background:rgba(10,14,19,.92);border:1px solid var(--line2);padding:8px 10px;max-width:190px}
#legend.show{display:flex}
#legend .lg-t{font-family:var(--mono);font-size:10px;color:var(--dim);letter-spacing:2px;margin-bottom:4px}
#legend .lg-i{display:flex;align-items:center;gap:7px;font-size:11px;color:var(--txt)}
#legend .lg-i i{width:10px;height:10px;flex:none;border:1px solid rgba(255,255,255,.18)}
#legend .lg-i.lnk{cursor:pointer;padding:2px 4px;margin:-2px -4px;border:1px solid transparent}
#legend .lg-i.lnk:hover{background:rgba(232,224,200,.08)}
#legend .lg-i.lnk.on{background:rgba(232,224,200,.13);border-color:var(--line2);color:var(--steelhi)}

/* ===== 侧栏 ===== */
#sidebar{position:absolute;z-index:40;top:0;left:0;bottom:0;width:348px;max-width:92vw;
  background:linear-gradient(90deg,rgba(11,16,21,.98),rgba(11,16,21,.95));
  border-right:1px solid var(--line2);transform:translateX(-105%);transition:transform .28s cubic-bezier(.2,.8,.2,1);
  display:flex;flex-direction:column}
#sidebar.open{transform:translateX(0)}
#sb-head{display:flex;align-items:flex-start;gap:4px;padding:10px 12px;border-bottom:1px solid var(--line)}
#sb-title{flex:1;min-width:0}
#sb-title h2{font-size:17px;font-weight:600;letter-spacing:1px;font-family:var(--serif);color:var(--txt)}
#sb-title .sub{font-family:var(--mono);font-size:10px;color:var(--dim);letter-spacing:1px;margin-top:2px}
#sb-close{font-family:var(--mono);font-size:14px;color:var(--dim);padding:4px 8px;border:1px solid var(--line2)}
#sb-close:hover{color:var(--gold);border-color:var(--gold)}
#sb-close:focus-visible{outline:1px solid var(--gold)}
#sb-body{flex:1;overflow-y:auto;overscroll-behavior:contain;padding:12px;scrollbar-width:thin;scrollbar-color:var(--line2) transparent}
#sb-body::-webkit-scrollbar{width:6px}
#sb-body::-webkit-scrollbar-thumb{background:var(--line2)}
#sb-resizer{position:absolute;top:0;right:-5px;bottom:0;width:10px;cursor:col-resize;z-index:45;touch-action:none}
#sb-resizer::after{content:"";position:absolute;top:0;bottom:0;right:4px;width:1px;background:var(--line2);transition:background .15s}
#sb-resizer:hover::after,#sidebar.dragging #sb-resizer::after{width:3px;right:3px;background:var(--gold)}

/* ===== 紧张度指示器(地图右上角) ===== */
#defcon{position:absolute;z-index:22;top:10px;right:12px;display:flex;flex-direction:column;align-items:center;
  padding:7px 12px 5px;background:rgba(8,12,17,.92);border:1px solid var(--line2);cursor:pointer;font-family:var(--mono)}
#defcon:hover{border-color:var(--gold)}
#defcon:focus-visible{outline:1px solid var(--gold)}
#defcon .dc-num{font-size:22px;font-weight:700;line-height:1.1;color:#4fa875}
#defcon .dc-cap{font-size:9px;letter-spacing:2px;color:var(--dim);margin-top:2px}
#defcon.lv2 .dc-num{color:#8ac79f}
#defcon.lv3 .dc-num{color:#b08a2a}
#defcon.lv4 .dc-num{color:#c25a4a}
#defcon.lv5{border-color:rgba(227,75,63,.7)}
#defcon.lv5 .dc-num{color:#e34b3f;animation:dcpulse 1.1s ease-in-out infinite}
@keyframes dcpulse{0%,100%{opacity:1}50%{opacity:.35}}

/* ===== 战争清单(右侧栏) ===== */
#warbar{position:absolute;z-index:40;top:0;right:0;bottom:0;width:348px;max-width:92vw;
  background:linear-gradient(270deg,rgba(11,16,21,.98),rgba(11,16,21,.95));
  border-left:1px solid var(--line2);transform:translateX(105%);transition:transform .28s cubic-bezier(.2,.8,.2,1);
  display:flex;flex-direction:column}
#warbar.open{transform:translateX(0)}
#wb-head{display:flex;align-items:flex-start;gap:4px;padding:10px 12px;border-bottom:1px solid var(--line)}
#wb-title{flex:1;min-width:0}
#wb-title h2{font-size:17px;font-weight:600;letter-spacing:1px;font-family:var(--serif);color:var(--txt)}
#wb-title .sub{font-family:var(--mono);font-size:10px;color:var(--dim);letter-spacing:1px;margin-top:2px}
#wb-close{font-family:var(--mono);font-size:14px;color:var(--dim);padding:4px 8px;border:1px solid var(--line2)}
#wb-close:hover{color:var(--gold);border-color:var(--gold)}
#wb-body{flex:1;overflow-y:auto;overscroll-behavior:contain;padding:12px;scrollbar-width:thin;scrollbar-color:var(--line2) transparent}
#wb-body::-webkit-scrollbar{width:6px}
#wb-body::-webkit-scrollbar-thumb{background:var(--line2)}
.wb-scale{display:flex;gap:3px;margin-bottom:12px}
.wb-scale span{flex:1;text-align:center;font-family:var(--mono);font-size:9px;color:var(--faint);
  border:1px solid var(--line);padding:4px 0;letter-spacing:0}
.wb-scale span i{display:block;font-style:normal;font-size:13px;font-weight:700;margin-bottom:1px;color:var(--dim)}
.wb-scale span.on{border-color:var(--gold);color:var(--txt)}
.wb-scale span.on i{color:var(--gold)}
.wcard{border:1px solid var(--line);background:rgba(14,20,26,.5);margin-bottom:10px;padding:9px 10px}
.wc-t{font-family:var(--serif);font-size:14px;font-weight:600;color:var(--txt);letter-spacing:.5px;
  display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.wc-since{font-family:var(--mono);font-size:9px;color:var(--dim);font-weight:400;flex:none}
.wc-vs{display:flex;align-items:stretch;gap:6px;margin-top:8px}
.wf{flex:1;min-width:0}
.wf-name{font-family:var(--mono);font-size:11px;color:var(--steelhi);cursor:pointer;padding:4px 6px;
  border:1px solid var(--line);user-select:none;display:flex;align-items:center;justify-content:space-between;gap:4px}
.wf-name:hover{border-color:var(--gold)}
.wf.R .wf-name{flex-direction:row-reverse;text-align:right}
.wf-name .n-caret{font-style:normal;font-size:9px;color:var(--dim);transition:transform .15s}
.wf.open .wf-name .n-caret{transform:rotate(90deg);color:var(--gold)}
.wf-flags{display:none;flex-wrap:wrap;gap:4px;padding:6px 2px 0}
.wf.open .wf-flags{display:flex}
.wf-m{display:inline-flex;align-items:center;gap:3px}
.wf-m .wf-f{width:20px;height:14px;object-fit:cover;border:1px solid rgba(255,255,255,.15);display:block}
.wf-m .wf-e{font-style:normal;font-size:15px;line-height:1}
.wf-m em{font-style:normal;font-family:var(--mono);font-size:8px;color:var(--faint)}
.wf-m.chip{font-family:var(--mono);font-size:10px;color:var(--txt);border:1px solid var(--line2);padding:2px 6px}
.wc-x{flex:none;align-self:center;font-family:var(--mono);font-size:10px;color:#a63d2e;letter-spacing:1px}
.wc-note{font-size:11px;color:var(--dim);line-height:1.7;margin-top:8px;border-top:1px dashed var(--line);padding-top:6px}
.wc-src{font-family:var(--mono);font-size:9px;color:var(--faint);margin-top:4px;line-height:1.6}

.leader{display:flex;gap:12px;align-items:center;margin-bottom:12px}
.leader .ph{width:74px;height:88px;flex:none;border:1px solid var(--line2);background:var(--panel) center/cover no-repeat;position:relative}
.leader .ph.fallback{display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:22px;color:var(--gold)}
.leader .who{min-width:0}
.leader .who .nm{font-size:15px;font-weight:600;font-family:var(--serif);letter-spacing:.5px}
.leader .who .tt{font-size:11px;color:var(--gold);font-family:var(--mono);margin-top:2px}
.leader .who .sn{font-size:10px;color:var(--dim);font-family:var(--mono);margin-top:3px}

.sec{margin:12px 0 4px}
.sec-t{font-family:var(--mono);font-size:10px;letter-spacing:2px;color:var(--dim);display:flex;align-items:center;gap:8px;margin-bottom:6px}
.sec-t::after{content:"";flex:1;height:0;border-top:1px dashed #2b3a44}
.kv{display:grid;grid-template-columns:64px 1fr;gap:4px 10px;font-size:12px}
.kv dt{color:var(--faint);font-family:var(--mono);font-size:10px;letter-spacing:1px;padding-top:2px}
.kv dd{color:var(--txt)}

/* 体制悬停解说 */
.tip{position:relative;border-bottom:1px dotted var(--dim);cursor:help}
.tip .tip-q{font-style:normal;font-family:var(--mono);font-size:9px;color:var(--gold);
  border:1px solid rgba(201,168,76,.5);padding:0 3px;margin-left:5px;vertical-align:1px}
.tip::after{content:attr(data-tip);position:absolute;left:0;bottom:calc(100% + 7px);z-index:60;
  width:min(300px,74vw);background:#10161d;border:1px solid var(--line2);border-left:2px solid var(--gold);
  padding:8px 10px;font-size:11px;line-height:1.55;color:var(--txt);letter-spacing:0;
  opacity:0;pointer-events:none;transition:opacity .15s;white-space:normal;font-family:var(--sans)}
.tip:hover::after{opacity:1}

.pie-row{display:flex;gap:12px;align-items:center}
.pie-row svg{flex:none}
.pie-lg{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.pie-lg .pi{display:flex;align-items:center;gap:6px;font-size:11px}
.pie-lg .pi i{width:8px;height:8px;flex:none}
.pie-lg .pi b{margin-left:auto;font-family:var(--mono);font-weight:400;color:var(--dim)}
.trd{font-family:var(--mono);font-size:9px;letter-spacing:-1px}
.trd.u{color:#c2593a}
.trd.d{color:#6d9a55}
.trd.f{color:#5d5947}
.pie-note{font-family:var(--mono);font-size:9px;color:var(--faint);margin-top:7px;letter-spacing:.5px;line-height:1.7}

/* 政局 · 议会半圆图 */
.parl-one,.parl-us{margin:2px 0 2px}
.parl-us{display:flex;gap:10px}
.parl-us .pu{flex:1;min-width:0}
.pu-t{font-family:var(--mono);font-size:10px;color:var(--dim);letter-spacing:1px;margin-bottom:3px}
.parl-svg{width:100%;height:auto;display:block}
.parl-lg{display:flex;flex-wrap:wrap;gap:3px 10px;margin-top:6px}
.parl-lg .pi{display:flex;align-items:center;gap:5px;font-size:11px}
.parl-lg .pi i{width:8px;height:8px;flex:none}
.parl-lg .pi b{font-family:var(--mono);font-weight:400;color:var(--dim)}
.parl-note{font-family:var(--mono);font-size:9px;color:var(--faint);margin-top:5px;letter-spacing:.5px}

.chips{display:flex;flex-wrap:wrap;gap:4px}
.chips .chip{font-size:10px;font-family:var(--mono);padding:2px 7px;border:1px solid var(--line2);color:var(--dim)}
.chips .chip.hot{color:var(--gold);border-color:rgba(201,168,76,.45)}

.rel-sum{display:flex;gap:8px;flex-wrap:wrap}
.rel-sum .rs{position:relative;font-family:var(--mono);font-size:10px;padding:3px 8px;border:1px solid var(--line2);color:var(--dim)}
.rel-sum .rs b{font-weight:400;margin-left:4px}
.rs.a{color:var(--r-ally)}.rs.g{color:var(--r-good)}.rs.t{color:var(--r-tense)}.rs.w{color:var(--r-war)}
/* 悬停/点按: 关系成员国小旗弹层 */
.rs-pop{display:none;position:absolute;left:50%;transform:translateX(-50%);bottom:calc(100% + 7px);z-index:60;
  min-width:160px;max-width:240px;background:rgba(8,12,17,.97);border:1px solid var(--line2);padding:8px 9px;
  flex-wrap:wrap;gap:5px 9px;box-shadow:0 8px 20px rgba(0,0,0,.55)}
.rs-pop::after{content:"";position:absolute;top:100%;left:50%;transform:translateX(-50%);
  border:5px solid transparent;border-top-color:var(--line2)}
.rs:hover .rs-pop,.rs:focus-within .rs-pop,.rs.open .rs-pop{display:flex}
.rs-c{display:inline-flex;align-items:center;gap:4px;font-family:var(--mono);font-size:10px;color:var(--txt);white-space:nowrap}

/* 新闻列表 · 可展开 */
#news-list{list-style:none;display:flex;flex-direction:column}
#news-list li{border-top:1px dashed #26323c;padding:8px 0}
#news-list li.xp{cursor:pointer}
#news-list .n-meta{display:flex;gap:6px;font-family:var(--mono);font-size:9px;color:var(--faint);letter-spacing:.5px;margin-bottom:3px}
#news-list .n-src{color:var(--steelhi)}
#news-list .n-head{display:flex;align-items:flex-start;gap:6px}
#news-list .n-t{flex:1;font-family:var(--serif);font-size:13px;font-weight:600;line-height:1.5;color:var(--txt);text-decoration:none;display:block}
#news-list li.xp:hover .n-t{color:var(--goldhi)}
#news-list a.n-t:hover{color:var(--goldhi)}
#news-list .n-caret{font-family:var(--mono);font-size:10px;color:var(--faint);flex:none;transition:transform .18s;padding-top:2px}
#news-list li.open .n-caret{transform:rotate(90deg);color:var(--gold)}
#news-list .n-detail{display:none;margin-top:8px;background:var(--paper);border:1px solid var(--paperln);border-top:3px double var(--paperln);padding:8px 10px 9px}
#news-list li.open .n-detail{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-start}
#news-list .n-detail::before{content:"··· 前线电讯 ···";flex:0 0 100%;font-family:var(--mono);font-size:8px;letter-spacing:3px;color:#7a7052;text-align:center;margin:-1px 0 2px}
#news-list .n-body{flex:1;min-width:0}
#news-list .n-sum{font-family:var(--serif);font-size:12px;line-height:1.65;color:var(--ink)}
#news-list .n-orig{font-family:var(--mono);font-size:9px;color:#6d6750;margin-top:5px;line-height:1.5}
#news-list .n-img{width:96px;max-height:96px;flex:none;border:1px solid var(--paperln);object-fit:cover;background:#c9bd9a;filter:grayscale(1) contrast(1.03)}
#news-list .n-link{display:inline-block;margin-top:6px;font-family:var(--mono);font-size:10px;color:#7a5a1a;text-decoration:none}
#news-list .n-link:hover{color:#4a3310}
.news-empty{font-family:var(--mono);font-size:10px;color:var(--faint);letter-spacing:1px;padding:10px 0}
.twn-note{font-size:11px;color:var(--dim);border:1px dashed var(--line2);padding:8px;margin-bottom:10px}

/* ===== 底部情报流 ===== */
#ticker{position:relative;z-index:25;height:30px;border-top:1px solid var(--line2);background:rgba(9,12,16,.95);
  display:flex;align-items:center;overflow:hidden}
#ticker .tk-tag{flex:none;font-family:var(--mono);font-size:10px;letter-spacing:3px;color:var(--gold);padding:0 12px;height:100%;display:flex;align-items:center;border-right:1px solid var(--line2)}
#ticker .tk-view{flex:1;overflow:hidden;position:relative;height:100%}
#ticker .tk-track{position:absolute;white-space:nowrap;display:flex;align-items:center;height:100%;animation:tick 60s linear infinite;font-family:var(--mono);font-size:11px;color:var(--dim)}
#ticker .tk-track:hover{animation-play-state:paused}
#ticker .tk-track .tk-i{margin:0 18px;cursor:pointer}
#ticker .tk-track .tk-i:hover{color:var(--goldhi)}
#ticker .tk-track .tk-src{color:var(--steel);font-size:9px}
@keyframes tick{from{transform:translateX(0)}to{transform:translateX(-50%)}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}

/* ===== 紧凑适配 ===== */
@media (max-width:560px){
  #meta{display:none}
  .brand .ver{display:none}
  #sidebar{width:100vw!important;max-width:100vw;border-right:none}
  #warbar{width:100vw!important;max-width:100vw;border-left:none}
  #sb-resizer{display:none}
  #legend{bottom:40px;right:8px;max-width:150px}
}
@media (prefers-reduced-motion:reduce){
  .brand .dot,#ticker .tk-track{animation:none}
  #sidebar,#warbar,#defcon.lv5 .dc-num{transition:none;animation:none}
}
#geo-toast{position:fixed;left:50%;bottom:64px;transform:translateX(-50%) translateY(8px);z-index:999;
  background:#1a2027;border:1px solid #3a4450;color:#d8c98a;font-size:12px;line-height:1.5;
  padding:8px 14px;border-radius:6px;opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;
  max-width:80%;text-align:center}
#geo-toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>
<main id="app" class="kimi-host-safe-context">
  <header id="topbar" class="kimi-host-safe-header">
    <div class="brand"><span class="dot"></span>The&nbsp;Nexus&nbsp;Order</div>
    <nav class="modes" role="group" aria-label="地图视图模式">
      <button data-mode="default" class="on" aria-pressed="true">态势</button>
      <button data-mode="ideo" aria-pressed="false">意识形态</button>
      <button data-mode="alliance" aria-pressed="false">联盟</button>
      <button data-mode="temp" aria-pressed="false">气温</button>
      <button data-mode="gdp" aria-pressed="false">GDP</button>
      <button data-mode="gdppc" aria-pressed="false">人均</button>
      <button data-mode="power" aria-pressed="false">电力</button>
      <button data-mode="markets" aria-pressed="false">股票</button>
    </nav>
    <div id="meta">
      <span id="modeind">视图·态势</span>
      <span id="asof"></span>
      <span id="newsstamp">嗅探器待机</span>
    </div>
  </header>

  <div id="mapwrap">
    <div id="map" role="application" aria-label="世界地图"></div>
    <div class="vignette"></div>
    <div id="legend" aria-hidden="true"></div>
    <button id="defcon" class="lv3" aria-label="全球紧张度，点击查看战争清单" title="紧张度 3/5 · 点击查看战争清单">
      <span class="dc-num" id="dc-num">3</span>
      <span class="dc-cap">紧张度</span>
    </button>
  </div>

        pts.push([lon,lat]);

function tipFor(kind, text){
  var arr = TIP_ORDER[kind];
  if(!text || !arr) return null;
  for(var i=0;i<arr.length;i++){
    var key=arr[i][0], als=arr[i][1];
    if(!TIPS[key]) continue;
    for(var j=0;j<als.length;j++){ if(text.indexOf(als[j])>=0) return TIPS[key]; }
  }
  return null;
}
function tipDD(label, kind, val){
  var v = val || "—";
  var tip = tipFor(kind, val);
  return "<dt>"+label+"</dt><dd>"+
    (tip ? '<span class="tip" data-tip="'+esc(tip)+'">'+esc(v)+'<i class="tip-q">?</i></span>' : esc(v))+

       每个国家输出三联(原名/#W/#E), 让左右两个环绕副本也有边框和国名 */
    var border = BASE_BORDER, bw = 0.6;

    if (state.sel===iso){ border=SEL_BORDER; bw=1.8; }
    var style = {areaColor:"rgba(0,0,0,0)", borderColor:border, borderWidth:bw};
    var lbl = null;
    if (state.mode==="default" && DB[iso]){
      var tier = DB[iso].tier, lm = LBL_META[iso];

/* ---------- 侧栏 ---------- */
/* 派系色: 精确命中用定色; "意识形态-派系" 自动取母色并按后缀做稳定明暗偏移, 同族各派可辨 */
function pieColor(name){
  if(PIE_COLOR[name]) return PIE_COLOR[name];
  var base = String(name).split("-")[0];
  var col = PIE_COLOR[base];
  if(!col) return "#5f5f66";
  var suf = String(name).slice(base.length), h = 0;
  for(var i=0;i<suf.length;i++) h = (h*131 + suf.charCodeAt(i)) >>> 0;
  var f = 0.72 + (h % 5) * 0.14;  /* 0.72~1.28 明暗梯度 */
  return shadeHex(col, f);
}
function shadeHex(hex, f){
  var r = Math.min(255, Math.round(parseInt(hex.slice(1,3),16)*f));
  var g = Math.min(255, Math.round(parseInt(hex.slice(3,5),16)*f));
  var b = Math.min(255, Math.round(parseInt(hex.slice(5,7),16)*f));
  return "#"+((1<<24)+(r<<16)+(g<<8)+b).toString(16).slice(1);
}
/* ISO3 → emoji 国旗(GEO_ISO2 全表, data.js 生成) */
function flagEmoji(iso){
  var c = (window.GEO_ISO2||{})[iso];
  if(!c || c.length!==2) return "🏳";
  return String.fromCodePoint(127462 + c.charCodeAt(0) - 97, 127462 + c.charCodeAt(1) - 97);
}
function pieSVG(pie){
  var total = pie.reduce(function(s,p){return s+p[1]},0) || 1;
  var cx=40, cy=40, r=34, ir=20, a0=-Math.PI/2, paths="";
  pie.forEach(function(p){
    var frac = p[1]/total, a1 = a0 + frac*Math.PI*2;
    var large = frac>0.5?1:0;
    var x0=cx+r*Math.cos(a0), y0=cy+r*Math.sin(a0), x1=cx+r*Math.cos(a1), y1=cy+r*Math.sin(a1);
    var xi1=cx+ir*Math.cos(a1), yi1=cy+ir*Math.sin(a1), xi0=cx+ir*Math.cos(a0), yi0=cy+ir*Math.sin(a0);
    var col = pieColor(p[0]);
    paths += '<path d="M'+x0.toFixed(1)+" "+y0.toFixed(1)+" A"+r+" "+r+" 0 "+large+" 1 "+x1.toFixed(1)+" "+y1.toFixed(1)+
      " L"+xi1.toFixed(1)+" "+yi1.toFixed(1)+" A"+ir+" "+ir+" 0 "+large+" 0 "+xi0.toFixed(1)+" "+yi0.toFixed(1)+
      ' Z" fill="'+col+'" stroke="#0b0f14" stroke-width="1"/>';
    a0 = a1;
  });
  return '<svg width="80" height="80" viewBox="0 0 80 80" aria-hidden="true">'+paths+"</svg>";
}

/* 政局 · 议会半圆扇形图 */
function hemiSVG(groups, total){
  var W=240, H=132, cx=W/2, cy=H-8;
  var rows = total<=110?4 : total<=260?5 : total<=600?7 : 10;
  var R=Math.min(cx-8, cy-4), rIn=R*0.40;
  var radii=[], lens=[], sum=0, i, j;
  for(i=0;i<rows;i++){var r=rows===1?R:rIn+i*(R-rIn)/(rows-1);radii.push(r);var L=Math.PI*r;lens.push(L);sum+=L;}
  var raw=lens.map(function(L){return L/sum*total});
  var counts=raw.map(function(v){return Math.floor(v)});
  var rem=total-counts.reduce(function(a,b){return a+b},0);
  var frac=raw.map(function(v,ix){return [v-Math.floor(v),ix]}).sort(function(a,b){return b[0]-a[0]});
  for(i=0;i<rem;i++) counts[frac[i][1]]++;
  var dots="", gi=0, used=0;
  for(i=0;i<rows;i++){
    var n=counts[i]; if(!n) continue;
    var rr=radii[i];
    var dr=Math.max(0.8, Math.min(Math.PI*rr/n*0.34, (rows>1?(R-rIn)/(rows-1):R)*0.38, 3.4));
    for(j=0;j<n;j++){
      var a=Math.PI+(j+0.5)*(Math.PI/n);
      var x=cx+rr*Math.cos(a), y=cy+rr*Math.sin(a);
      while(gi<groups.length-1 && used>=groups[gi][1]){gi++;used=0;}
      var col=groups[gi]?groups[gi][2]:"#3a3d42";
      used++;
      dots+='<circle cx="'+x.toFixed(1)+'" cy="'+y.toFixed(1)+'" r="'+dr.toFixed(1)+'" fill="'+col+'"/>';
    }
  }
  return '<svg class="parl-svg" viewBox="0 0 '+W+' '+H+'" aria-hidden="true">'+dots+'</svg>';
}
function parlHTML(p){
  if(!p) return "";

  function lg(g){return '<div class="parl-lg">'+g.map(function(x){
    return '<div class="pi"><i style="background:'+x[2]+'"></i>'+esc(x[0])+'<b>'+x[1]+'</b></div>'}).join("")+'</div>'}
  var h='<section class="sec" data-kimi-priority="p1"><div class="sec-t">政局 · 权力格局</div>';

       lg(merged)+'<div class="parl-note">席位为参众两院合计 · '+esc(p.year||"")+'</div>';
  } else {
    h+='<div class="parl-one"><div class="pu-t">'+esc(p.name||"议会")+' · '+(p.total||tot(p.groups))+' 席'+(p.year?' · '+esc(p.year):'')+'</div>'+

   按经纬度坐标画进 ECharts 同一坐标系 —— 结构上与矢量图不可分离 */
var W0 = 4096, H0 = 2048;
var HAS_2D = (typeof Path2D !== "undefined") && !!(document.createElement);

/* geojson 多边形 → Path2D(合成像素坐标, 静态缓存; 跨日界线段抬笔防拉穿) */
function polyPath(geom){
  var p = new Path2D();
  var polys = geom.type==="Polygon" ? [geom.coordinates] : (geom.type==="MultiPolygon" ? geom.coordinates : []);
  for(var i=0;i<polys.length;i++){
    for(var j=0;j<polys[i].length;j++){
      var ring = polys[i][j], prev = null;
      for(var k=0;k<ring.length;k++){
        var pt = wxy(ring[k][0], ring[k][1]);
        if(prev && Math.abs(ring[k][0]-prev)>180) p.moveTo(pt[0], pt[1]);
        else if(k===0) p.moveTo(pt[0], pt[1]);
        else p.lineTo(pt[0], pt[1]);
        prev = ring[k][0];
      }
      p.closePath();
    }
  }
  return p;
}
function buildSubPaths(){

function zoneColor(c, z){

}
function buildConflictPaths(){
  CONF_ZONE = []; CONF_FRONT = [];

    });

/* 斜纹(占领)/点纹(活跃)/交叉纹(争夺): 与国家平色区分开, 一眼读出"武装控制" */
function zonePattern(col, kind){
  var key = col+"|"+kind;
  if(PATC[key]) return PATC[key];
  var cv = document.createElement("canvas"); cv.width = cv.height = 8;
  var g = cv.getContext("2d");
  if(kind==="active"){
    g.fillStyle = col; g.globalAlpha = 0.85;
    g.fillRect(1,1,2.2,2.2); g.fillRect(5,5,2.2,2.2);
  } else {
    g.strokeStyle = col; g.globalAlpha = 0.85; g.lineWidth = 1.5;
    g.beginPath(); g.moveTo(-2,10); g.lineTo(10,-2); g.moveTo(-2,2); g.lineTo(2,-2); g.moveTo(6,10); g.lineTo(10,6); g.stroke();
    if(kind==="contested"){
      g.beginPath(); g.moveTo(-2,-2); g.lineTo(10,10); g.moveTo(6,-2); g.lineTo(10,2); g.moveTo(-2,6); g.lineTo(2,10); g.stroke();

function drawConflictLayer(){

/* 占区标签(俄占区/RSF控制区/前线活跃区…): 屏幕定级小字, 三联世界各一份 */
function conflictMarkers(){
  if(state.mode!=="default") return [];
  var out = [];
  (CONFLICT.conflicts||[]).forEach(function(c){
    (c.zones||[]).forEach(function(z){
      if(!z.label || !z.at) return;
      var col = zoneColor(c, z);
      for(var k=-1;k<=1;k++){
        out.push({name:z.label, value:[z.at[0]+k*360, z.at[1]],
          label:{borderColor:alpha(col,.75)},

      }
    });
  });
  return out;
}
function linePath(geom){
  var p = new Path2D();
  var lines = geom.type==="LineString" ? [geom.coordinates] : (geom.type==="MultiLineString" ? geom.coordinates : []);
  for(var i=0;i<lines.length;i++){
    var prev = null;
    for(var k=0;k<lines[i].length;k++){
      var pt = wxy(lines[i][k][0], lines[i][k][1]);
      if(k===0 || (prev!=null && Math.abs(lines[i][k][0]-prev)>180)) p.moveTo(pt[0], pt[1]);
      else p.lineTo(pt[0], pt[1]);
      prev = lines[i][k][0];
    }

}
function buildFeaturePaths(){
  if(!HAS_2D || !window.WORLD_GEOJSON) return;
  var x0=1e9,x1=-1e9,y0=1e9,y1=-1e9;
  (window.WORLD_GEOJSON.features||[]).forEach(function(f){
    var nm = f.properties && f.properties.name;
    if(nm && f.geometry) FEAT_PATH[nm] = polyPath(f.geometry);
    // 顺便算 geojson 经纬度包围盒(视图单位常量, 供平移钳制)
    var polys = f.geometry.type==="Polygon" ? [f.geometry.coordinates] : (f.geometry.type==="MultiPolygon" ? f.geometry.coordinates : []);
    for(var i=0;i<polys.length;i++) for(var j=0;j<polys[i].length;j++) for(var k=0;k<polys[i][j].length;k++){
      var c = polys[i][j][k];
      if(c[0]<x0)x0=c[0]; if(c[0]>x1)x1=c[0];
      if(c[1]<y0)y0=c[1]; if(c[1]>y1)y1=c[1];
    }
  });
  if(x1>x0){ GEO_CX=(x0+x1)/2*0.75; GEO_CY=(y0+y1)/2; GEO_SX=(x1-x0)*0.75; GEO_SY=(y1-y0); }
  var W = window.WORLD_WATER || {};
  (W.lakes||[]).forEach(function(f){ if(f.geometry) WATER_PATH.lakes.push(polyPath(f.geometry)); });
  (W.rivers||[]).forEach(function(f){ if(f.geometry) WATER_PATH.rivers.push(linePath(f.geometry)); });
}
/* 当前状态(模式/选中/数据)下某国的政治色 —— 纯逻辑, 供合成与测试共用 */
function fillColorOf(iso){
  var rel = state.sel && DB[state.sel] ? relOfSelected(state.sel) : null;
  if (state.mode==="ideo"){
    var c = DB[iso]; return c && c.cls ? (CLS_COLOR[c.cls]||BASE_FILL) : BASE_FILL;
  }
  if (state.mode==="alliance"){
    if(!state.selAlliance) return ALL_GRAY;
    var c2 = DB[iso];
    return (c2 && (c2.al||[]).indexOf(state.selAlliance)>=0) ? (AL_COLOR[state.selAlliance]||"#8a7340") : ALL_GRAY;
  }
  if (state.mode==="temp") return tempColor(DATA.temps ? DATA.temps[iso] : null);
  if (state.mode==="gdp") return gdpColor(ECON.gdp ? ECON.gdp[iso] : null);
  if (state.mode==="gdppc") return gdppcColor(ECON.gdppc ? ECON.gdppc[iso] : null);
  if (state.mode==="power") return powerColor(ECON.power ? ECON.power[iso] : null);
  if (iso==="ATA" || iso==="ATF") return "#0c1015";

    if(rel.war[iso]) return REL_COLOR.war;

function tintAlpha(iso, col){
  if(col===ALL_GRAY) return 0.82;
  if(col===DIM_FILL || col===BASE_FILL) return 0.82;  // 压暗/无数据: 盖实一点
  if(iso==="ATA"||iso==="ATF") return 0.85;
  var R = REL_COLOR;
  if(col===R.war||col===R.tense||col===R.good||col===R.ally) return 0.72;  // 关系色要醒目

function repaintWorld(){

/* ---------- 漫游边界: 垂直瞬时钳制; 水平无限环绕(地球是圆的) ----------
   地图数据为三联世界(-360°/0°/+360°), 视图中心越过 ±180° 时瞬间平移一个世界,
   三份完全相同 → 跳变不可见; 缩放永远不低于铺满视口的尺度 */
function worldRectPx(){
  var p0 = chart.convertToPixel({geoIndex:0}, [-180, 90]);
  var p1 = chart.convertToPixel({geoIndex:0}, [180, -90]);
  return {x0:p0[0], y0:p0[1], x1:p1[0], y1:p1[1]};
}
/* 反解当前视图中心(视图单位): px = (GEO_C - c)*ppu + L */
function viewCenterVU(){
  var el = document.getElementById("map");
  var W = el.clientWidth, H = el.clientHeight;
  var r = worldRectPx();
  var ppuX = (r.x1-r.x0)/GEO_SX, ppuY = (r.y1-r.y0)/GEO_SY;
  var wcx = (r.x0+r.x1)/2, wcy = (r.y0+r.y1)/2;
  return { x: GEO_CX - (wcx - W/2)/ppuX,
           y: GEO_CY + (wcy - H*0.51)/ppuY,
           ppuX: ppuX, ppuY: ppuY, r: r, W: W, H: H };
}
function clampRoam(){
  if(!chart || !chart.getOption || !chart.convertToPixel) return;
  var el = document.getElementById("map"); if(!el) return;
  var W = el.clientWidth, H = el.clientHeight; if(!W || !H) return;
  /* 1) 缩放下限 = 一个世界刚好铺满视口(动态算) */
  var opt = chart.getOption();
  var g0 = (opt.geo && opt.geo[0]) || {};
  var z = g0.zoom || 1;
  var r0 = worldRectPx();
  var wPerZ = (r0.x1-r0.x0)/z, hPerZ = (r0.y1-r0.y0)/z;
  if(!(wPerZ>0 && hPerZ>0)) return;
  var need = Math.max(2.0, W/wPerZ, H/hPerZ);
  var lim = g0.scaleLimit || {};
  var upd = {};
  if(Math.abs((lim.min||0)-need) > 0.02) upd.scaleLimit = {min:need, max:need*6.4};
  if(z < need*0.99) upd.zoom = need;
  if(upd.zoom || upd.scaleLimit) chart.setOption({geo:upd});
  /* 2) 水平回绕: 中心经度越出 ±180°, 平移一个世界(270 视图单位) */
  var v = viewCenterVU();
  var centerLon = -180 + (v.W/2 - v.r.x0)/((v.r.x1-v.r.x0)/360);
  if(centerLon > 180 || centerLon < -180){
    chart.setOption({geo:{center:[v.x + (centerLon>180 ? -270 : 270), v.y]}});
    v = viewCenterVU();
  }
  /* 3) 垂直钳制(瞬时): 世界南北边不许进入视口内侧 */
  var h = v.r.y1 - v.r.y0, dy = 0;
  if(h <= v.H){ dy = (v.H-h)/2 - v.r.y0; }
  else if(v.r.y0 > 0){ dy = -v.r.y0; }
  else if(v.r.y1 < v.H){ dy = v.H - v.r.y1; }
  if(dy) chart.setOption({geo:{center:[v.x, v.y + dy/v.ppuY]}});
}
/* ---------- 三联世界: 复制三份 geojson(-360°/0°/+360°), 供水平环绕 ---------- */
function shiftCoords(c, dx){
  if(typeof c[0]==="number") return [c[0]+dx, c[1]];
  var out = [];
  for(var i=0;i<c.length;i++) out.push(shiftCoords(c[i], dx));
  return out;
}
function world3x(){
  var feats = (window.WORLD_GEOJSON||{}).features || [];
  var out = {type:"FeatureCollection", features:[]};
  for(var k=-1;k<=1;k++){
    feats.forEach(function(f){
      /* 副本必须改名(name 是 echarts 的主键, 重名会被去重导致包围盒算错);
         中间副本保留原名, 左 #W 右 #E, 查资料库时按 # 截断还原 */
      var props = {};
      if(f.properties) for(var key in f.properties) props[key] = f.properties[key];
      if(k!==0 && props.name) props.name = props.name + (k<0 ? "#W" : "#E");
      out.features.push({type:"Feature", properties:props,
        geometry: f.geometry ? {type:f.geometry.type, coordinates:shiftCoords(f.geometry.coordinates, k*360)} : null});
    });
  }
  return out;
}
/* geojson 要素名(可能带 #W/#E 副本后缀) → ISO3 */
function isoOfName(nm){
  if(!nm) return null;
  var h = nm.indexOf("#");
  return N2I[h>=0 ? nm.slice(0,h) : nm] || null;
}
/* ---------- 初始化地图 ---------- */
function initMap(){
  if (chart || !window.echarts || !window.WORLD_GEOJSON) return;
  echarts.registerMap("world", world3x());
  buildFeaturePaths();
  buildSubPaths();
  buildConflictPaths();
  buildArmiPaths();
  if(HAS_2D){
    worldCv = document.createElement("canvas");
    worldCv.width = W0; worldCv.height = H0;
    worldCx = worldCv.getContext("2d");
  }
  chart = echarts.init(document.getElementById("map"), null, {renderer:"canvas"});
  buildLabelMeta();
  chart.setOption({
    backgroundColor:"transparent",
    /* update 过渡归零: 漫游/钳制/换模式全部瞬时跳变, 杜绝元素滑行造成的重影分层 */
    animationDurationUpdate: 0,
    tooltip:{ trigger:"item", backgroundColor:"#0d1218", borderColor:"#33505e", borderWidth:1,
      textStyle:{color:"#d8cfae", fontSize:11, fontFamily:"ui-monospace,Menlo,monospace"},
      formatter:function(p){
        var iso = isoOfName(p.name); if(!iso) return esc(p.name);
        var c = DB[iso];
        var h = "<b>"+esc(cname(iso))+"</b>";
        if(c && !c.news_only && c.leader) h += "<br>"+esc(c.leader.t||"")+" "+esc(c.leader.n||"");
        if(c && c.news_only) h += "<br><span style='color:#8f8a74'>仅新闻情报</span>";
        var n = newsOf(iso).length;
        if(n) h += '<br><span style="color:#8fb8cb">今日情报 ×'+n+"</span>";
        if(state.mode==="temp" && DATA.temps && DATA.temps[iso]!=null)
          h += '<br><span style="color:#c9a84c">'+Math.round(DATA.temps[iso]*10)/10+" ℃</span>";
        return h;
      }},
    geo:{
      map:"world", roam:true, scaleLimit:{min:2.0, max:24}, zoom:3.75, top:"6%", bottom:"4%", zlevel:1,
      itemStyle:{areaColor:"rgba(0,0,0,0)", borderColor:BASE_BORDER, borderWidth:0.6},
      label:{show:false, color:"rgba(226,219,192,.88)", fontSize:9, fontWeight:"bold",
        textBorderColor:"rgba(5,8,11,.72)", textBorderWidth:2,
        fontFamily:'"Songti SC","STSong","Noto Serif SC",serif',
        formatter:function(p){var iso=isoOfName(p.name);return iso?(CN[iso]||""):""}},
      labelLayout:{hideOverlap:true},
      emphasis:{ itemStyle:{areaColor:"rgba(226,219,192,.14)", borderColor:"#e8e0c8", borderWidth:1},
                 label:{show:false} },
      select:{disabled:true},
      regions: buildRegions()
    },
    series:[{
      id:"worldpaint", type:"custom", coordinateSystem:"geo", zlevel:0, z:1, silent:true,
      renderItem:function(params, api){
        if(!worldCv) return null;
        var els = [];
        var vw = api.getWidth ? api.getWidth() : 1e9;
        for(var k=-1;k<=1;k++){
          var p0 = api.coord([-180+k*360,90]), p1 = api.coord([180+k*360,-90]);
          if(p1[0] < 0 || p0[0] > vw) continue;  // 视口外副本不画: 每帧最多省 2/3 的画布开销
          els.push({type:"image", style:{image:worldCv, x:p0[0], y:p0[1], width:p1[0]-p0[0], height:p1[1]-p0[1]}});
        }
        return {type:"group", children:els};
      },
      data:[[0,0]]
    },{
      id:"markers", type:"effectScatter", coordinateSystem:"geo", zlevel:2,
      symbolSize:function(v){return Math.min(4 + v[2]*1.6, 12)},
      rippleEffect:{brushType:"stroke", scale:2.4},
      itemStyle:{color:"#cfc6a2", shadowBlur:5, shadowColor:"rgba(216,207,174,.4)"},
      label:{show:false}, data: newsMarkers()
    },{
      id:"conflbl", type:"scatter", coordinateSystem:"geo", zlevel:2, silent:true,
      symbolSize:2.5,
      label:{show:true, position:"top", distance:5,
        formatter:function(p){return p.name}, fontSize:10, padding:[2,6], color:"#e8dfc0",
        backgroundColor:"rgba(8,12,17,.85)", borderColor:"rgba(216,207,174,.5)", borderWidth:1,
        fontFamily:'"PingFang SC","Microsoft YaHei",sans-serif'},
      data: conflictMarkers()
    },{
      id:"mkts", type:"scatter", coordinateSystem:"geo", zlevel:3, silent:true,
      symbolSize:3.5,
      label:{show:true, position:"top", distance:5,
        formatter:function(p){ var m=p.data.m; return m.name+" "+(m.chg>=0?"+":"")+m.chg.toFixed(2)+"%"; },
        fontSize:10, padding:[3,6], color:"#e8dfc0",
        backgroundColor:"rgba(8,12,17,.92)", borderColor:"rgba(216,207,174,.45)", borderWidth:1},
      data: marketMarkers()
    }]
  });
  chart.on("click", function(p){
    if (p.componentType==="geo" && p.name){
      var iso = isoOfName(p.name);
      if(iso) selectCountry(iso);
    } else if ((p.seriesType==="effectScatter" || p.seriesType==="scatter") && p.data && p.data.iso){
      selectCountry(p.data.iso);
    }
  });
  chart.getZr().on("click", function(e){ if(!e.target) closeSidebar(); });
  var roaming = false;
  chart.on("georoam", function(){
    if(roaming) return;
    roaming = true;
    try{ clampRoam(); } finally { roaming = false; }
  });
  window.addEventListener("resize", function(){ if(chart){ chart.resize(); clampRoam(); } });
  /* 首次钳制推迟到首帧渲染完成: 初始化瞬间 geo 变换可能未就绪, 量错会把 zoom 抬爆 */
  var firstDone = false;
  chart.on("finished", function(){ if(!firstDone){ firstDone = true; clampRoam(); } });
  repaintWorld();
  /* 地形异步到达后重合成(先出图, 地形随后浮现) */
  if(typeof Image !== "undefined"){
    terrainImg = new Image();
    terrainImg.onload = function(){ terrainOK = true; repaintWorld(); };
    terrainImg.src = "assets/terrain.jpg";
  }
}

/* ---------- 控件 ---------- */
function setMode(b){
  if(!b || !b.dataset || !b.dataset.mode) return;
  document.querySelectorAll(".modes button").forEach(function(x){
    var on = (x===b);
    x.classList.toggle("on", on);
    x.setAttribute("aria-pressed", on?"true":"false");
  });
  state.mode = b.dataset.mode;
  state.sel = null;
  state.selAlliance = null;
  document.getElementById("sidebar").classList.remove("open");
  var mi = document.getElementById("modeind");
  if(mi) mi.textContent = "视图·" + (MODE_NAME[state.mode]||state.mode);
  repaintWorld();
  renderMap();
}
document.querySelectorAll(".modes button").forEach(function(b){
  b.addEventListener("click", function(){ setMode(b); });
});
/* 兜底: 捕获阶段 pointerdown 委托, 防止宿主层吞掉 click */
document.addEventListener("pointerdown", function(e){
  var t = e.target;
  var b = (t && t.closest) ? t.closest(".modes button") : null;
  if(b) setMode(b);
}, true);
/* 联盟视图: 图例可点击, 点击联盟高亮成员国, 再点取消 */
document.getElementById("legend").addEventListener("click", function(e){
  var t = e.target && e.target.closest ? e.target.closest(".lg-i.lnk") : null;
  if(!t || !t.getAttribute("data-al")) return;
  var a = t.getAttribute("data-al");
  state.selAlliance = (state.selAlliance===a) ? null : a;
  repaintWorld(); renderLegend();
});
/* 新闻展开/收起(事件委托) + 关系徽章点按展开(触屏) */
document.getElementById("sb-body").addEventListener("click", function(e){
  var a = e.target.closest && e.target.closest("a.n-link, a.n-t");
  if(a){ e.preventDefault(); openExt(a.getAttribute("href")); return; }
  if(e.target.closest("a")) return;
  var rs = e.target.closest && e.target.closest(".rs");
  if(rs){ rs.classList.toggle("open"); return; }
  var li = e.target.closest("#news-list li.xp");
  if(li) li.classList.toggle("open");
});
document.getElementById("sb-close").addEventListener("click", closeSidebar);
/* ---------- 紧张度 + 战争清单(右侧栏) ---------- */
function warMemberHTML(m){
  if(m.label) return '<span class="wf-m chip">'+esc(m.label)+(m.tag?'<em>'+esc(m.tag)+'</em>':"")+'</span>';
  var i2 = ((CONFLICT.iso2||{})[m.iso]||"").toLowerCase();
  var emo = (CONFLICT.emoji||{})[m.iso]||"🏳";
  return '<span class="wf-m" title="'+esc(m.iso)+'">'+
    (i2 ? '<img class="wf-f" src="https://flagcdn.com/w40/'+i2+'.png" alt="'+esc(m.iso)+'" loading="lazy" onerror="this.style.display=\'none\';var n=this.nextElementSibling;if(n)n.style.display=\'inline-block\'">' : '')+
    '<i class="wf-e"'+(i2?' style="display:none"':"")+'>'+emo+'</i>'+
    (m.tag?'<em>'+esc(m.tag)+'</em>':"")+'</span>';
}
function factionHTML(f, side, ci){
  if(!f) return '<div class="wf"></div>';
  return '<div class="wf '+side+'">'+
    '<div class="wf-name">'+esc(f.name)+'<i class="n-caret">▸</i></div>'+
    '<div class="wf-flags">'+(f.members||[]).map(warMemberHTML).join("")+'</div></div>';
}
function renderWarbar(){
  var lv = CONFLICT.defcon, scale = CONFLICT.defcon_scale||[];
  document.getElementById("wb-sub").textContent =
    lv ? ("紧张度 "+lv+"/5 · "+(CONFLICT.defcon_note||"")) : "冲突数据库未加载";
  var h = "";
  if(lv){
    h += '<div class="wb-scale">'+scale.map(function(s,i){
      return '<span class="'+((i+1)===lv?"on":"")+'"><i>'+(i+1)+'</i>'+esc(s)+'</span>';
    }).join("")+"</div>";
  }
  (CONFLICT.conflicts||[]).forEach(function(c, i){
    h += '<section class="wcard"><div class="wc-t">'+esc(c.name)+'<span class="wc-since">'+esc(c.since||"")+'</span></div>'+
      '<div class="wc-vs">'+factionHTML(c.left,"L",i)+'<div class="wc-x">VS</div>'+factionHTML(c.right,"R",i)+'</div>'+
      (c.note?'<div class="wc-note">'+esc(c.note)+'</div>':"")+'</section>';
  });
  h += '<div class="wc-src">占区为风格化示意(非实时战况)；阵营构成为编辑整理('+(CONFLICT.updated||"—")+')，改 build_conflict.py 后重生成</div>';
  document.getElementById("wb-body").innerHTML = h;
}
function toggleWarbar(force){
  var wb = document.getElementById("warbar");
  var open = (force!==undefined) ? force : !wb.classList.contains("open");
  if(open) renderWarbar();
  wb.classList.toggle("open", open);
}
(function(){
  var dc = document.getElementById("defcon"), num = document.getElementById("dc-num");
  var lv = CONFLICT.defcon;
  if(lv){
    num.textContent = String(lv);
    dc.className = "lv"+lv;
    dc.title = "紧张度 "+lv+"/5 · "+((CONFLICT.defcon_scale||[])[lv-1]||"")+" · 点击查看战争清单";
  } else {
    num.textContent = "—";
  }
  dc.addEventListener("click", function(){ toggleWarbar(); });
  document.getElementById("wb-close").addEventListener("click", function(){ toggleWarbar(false); });
  document.getElementById("wb-body").addEventListener("click", function(e){
    var t = e.target && e.target.closest ? e.target.closest(".wf-name") : null;
    if(t && t.parentNode) t.parentNode.classList.toggle("open");
  });
})();
/* 侧栏宽度拖拽: 按住侧栏右边线左右拉伸, 宽度记住到 localStorage */
(function(){
  var sb = document.getElementById("sidebar"), rz = document.getElementById("sb-resizer");
  if(!sb || !rz) return;
  function clampW(w){ return Math.max(280, Math.min(w, 620, (window.innerWidth||1200)*0.92)); }
  try{
    var saved = window.localStorage.getItem("geo_sb_w");
    if(saved) sb.style.width = clampW(parseInt(saved,10)||0) + "px";
  }catch(e){}
  rz.addEventListener("pointerdown", function(e){
    e.preventDefault();
    sb.classList.add("dragging");
    var startX = e.clientX, startW = sb.getBoundingClientRect().width;
    function mv(ev){ sb.style.width = clampW(startW + ev.clientX - startX) + "px"; }
    function up(){
      sb.classList.remove("dragging");
      document.removeEventListener("pointermove", mv);
      document.removeEventListener("pointerup", up);
      try{ window.localStorage.setItem("geo_sb_w", String(Math.round(sb.getBoundingClientRect().width))); }catch(e2){}
    }
    document.addEventListener("pointermove", mv);
    document.addEventListener("pointerup", up);
  });
})();
document.addEventListener("keydown", function(e){ if(e.key==="Escape"){ closeSidebar(); toggleWarbar(false); } });

/* ---------- 启动 ---------- */
document.getElementById("asof").textContent = "资料库截至 " + (window.GEO_ASOF || "—");
initMap();
if (window.DaimonWidget && window.DaimonWidget.onDataChange){
  window.DaimonWidget.onDataChange(function(d){ applyData(d); });
} else {
  applyData(null);
}
renderMap();
})();
