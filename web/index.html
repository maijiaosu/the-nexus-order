<!DOCTYPE html>
<html lang="zh-CN">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Nexus Order · 世界沙盘</title>

<style>
:root{
  --bg:#090c10; --bg2:#0b0f14; --panel:#0d1218; --line:#1b2830; --line2:#33505e;
  --steel:#5b8296; --steelhi:#8fb8cb;
  --txt:#b5ccd1; --dim:#54a4af; --faint:#346970;
  --gold:#c9a84c; --goldhi:#e3c565;
  --paper:#bacfd3; --paperln:#4e9ba5; --ink:#162c35;
  --r-ally:#4e708c; --r-good:#42838b; --r-tense:#b08a2a; --r-war:#a63d2e;
  --sans:"TNO Sans",-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
  --serif:"TNO Serif","Songti SC","STSong","Noto Serif SC",serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,"Courier New",monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);color:var(--txt);font-family:var(--sans);font-size:13px;line-height:1.45;overflow:hidden}
button{font-family:inherit;color:inherit;background:none;border:none;cursor:pointer}
a{color:inherit}
#app{position:relative;width:100%;height:100%;display:flex;flex-direction:column;background:var(--bg)}

/* ===== Top bar ===== */
#topbar{position:relative;z-index:30;display:flex;align-items:center;gap:14px;flex-wrap:wrap;
  padding:10px 14px;padding-inline-end:14px;
  padding-block-start:calc(8px + 0px);
  border-bottom:1px solid var(--line2);background:linear-gradient(180deg,rgba(13,18,24,.97),rgba(9,12,16,.94));}
.brand{display:flex;align-items:center;gap:9px;font-family:var(--serif);font-size:14px;letter-spacing:3px;color:var(--txt)}
.brand .dot{width:7px;height:7px;background:var(--gold);transform:rotate(45deg);animation:pulse 3.2s infinite}
.brand .ver{color:var(--dim);font-size:10px;letter-spacing:3px;font-family:var(--mono)}
.modes{display:flex;gap:2px;border:1px solid var(--line2);padding:2px;background:rgba(13,18,24,.6)}
.modes button{font-family:var(--mono);font-size:11px;letter-spacing:1px;padding:5px 10px;color:var(--dim);border:1px solid transparent}
.modes button:hover{color:var(--txt)}
.modes button.on{color:var(--steelhi);background:#16222b;border-color:var(--steel);text-shadow:none}
.modes button:focus-visible{outline:1px solid var(--steel);outline-offset:1px}
#meta{margin-left:auto;display:flex;gap:14px;font-family:var(--mono);font-size:10px;color:var(--faint);letter-spacing:.5px}
#meta b{color:var(--dim);font-weight:400}
#meta .live{color:var(--steelhi)}
#meta .stale{color:var(--gold)}
#modeind{color:var(--gold)}

/* ===== Map area ===== */
#mapwrap{position:relative;flex:1;min-height:0;background:var(--bg)}
#map{position:absolute;inset:0;z-index:1}
.vignette{position:absolute;inset:0;pointer-events:none;z-index:6;
  background:radial-gradient(ellipse at 50% 45%,transparent 58%,rgba(0,0,0,.62) 100%);}

/* ===== Legend ===== */
#legend{position:absolute;z-index:20;right:12px;bottom:44px;display:none;flex-direction:column;gap:3px;
  background:rgba(10,14,19,.92);border:1px solid var(--line2);padding:8px 10px;max-width:190px}
#legend.show{display:flex}
#legend .lg-t{font-family:var(--mono);font-size:10px;color:var(--dim);letter-spacing:2px;margin-bottom:4px}
#legend .lg-i{display:flex;align-items:center;gap:7px;font-size:11px;color:var(--txt)}
#legend .lg-i i{width:10px;height:10px;flex:none;border:1px solid rgba(255,255,255,.18)}
#legend .lg-i.lnk{cursor:pointer;padding:2px 4px;margin:-2px -4px;border:1px solid transparent}
#legend .lg-i.lnk:hover{background:rgba(232,224,200,.08)}
#legend .lg-i.lnk.on{background:rgba(232,224,200,.13);border-color:var(--line2);color:var(--steelhi)}

/* ===== Sidebar ===== */
#sidebar{position:absolute;z-index:40;top:0;left:0;bottom:0;width:348px;max-width:92vw;
  background:linear-gradient(90deg,rgba(11,16,21,.98),rgba(11,16,21,.95));
  border-right:1px solid var(--line2);transform:translateX(-105%);transition:transform .28s cubic-bezier(.2,.8,.2,1);
  display:flex;flex-direction:column}
#sidebar.open{transform:translateX(0)}
#sb-head{display:flex;align-items:flex-start;gap:4px;padding:10px 12px;border-bottom:1px solid var(--line)}
#sb-title{flex:1;min-width:0}
#sb-title h2{font-size:17px;font-weight:600;letter-spacing:1px;font-family:var(--serif);color:var(--txt)}
#sb-title .sub{font-family:var(--mono);font-size:10px;color:var(--dim);letter-spacing:1px;margin-top:2px}
#sb-close{font-family:var(--mono);font-size:14px;color:var(--dim);padding:4px 8px;border:1px solid var(--line2)}
#sb-close:hover{color:var(--gold);border-color:var(--gold)}
#sb-close:focus-visible{outline:1px solid var(--gold)}
#sb-body{flex:1;overflow-y:auto;overscroll-behavior:contain;padding:12px;scrollbar-width:thin;scrollbar-color:var(--line2) transparent}
#sb-body::-webkit-scrollbar{width:6px}
#sb-body::-webkit-scrollbar-thumb{background:var(--line2)}
#sb-resizer{position:absolute;top:0;right:-5px;bottom:0;width:10px;cursor:col-resize;z-index:45;touch-action:none}
#sb-resizer::after{content:"";position:absolute;top:0;bottom:0;right:4px;width:1px;background:var(--line2);transition:background .15s}
#sb-resizer:hover::after,#sidebar.dragging #sb-resizer::after{width:3px;right:3px;background:var(--gold)}

/* ===== Tension indicator (top-right map corner) ===== */
#defcon{position:absolute;z-index:22;top:10px;right:12px;display:flex;flex-direction:column;align-items:center;
  padding:7px 12px 5px;background:rgba(8,12,17,.92);border:1px solid var(--line2);cursor:pointer;font-family:var(--mono)}
#defcon:hover{border-color:var(--gold)}
#defcon:focus-visible{outline:1px solid var(--gold)}
#defcon .dc-num{font-size:22px;font-weight:700;line-height:1.1;color:#4f9ea8}
#defcon .dc-cap{font-size:9px;letter-spacing:2px;color:var(--dim);margin-top:2px}
#defcon.lv2 .dc-num{color:#95b6bc}
#defcon.lv3 .dc-num{color:#b08a2a}
#defcon.lv4 .dc-num{color:#c25a4a}
#defcon.lv5{border-color:rgba(227,75,63,.7)}
#defcon.lv5 .dc-num{color:#e34b3f;animation:dcpulse 1.1s ease-in-out infinite}
@keyframes dcpulse{0%,100%{opacity:1}50%{opacity:.35}}

/* ===== War list (right sidebar) ===== */
#warbar{position:absolute;z-index:40;top:0;right:0;bottom:0;width:348px;max-width:92vw;
  background:linear-gradient(270deg,rgba(11,16,21,.98),rgba(11,16,21,.95));
  border-left:1px solid var(--line2);transform:translateX(105%);transition:transform .28s cubic-bezier(.2,.8,.2,1);
  display:flex;flex-direction:column}
#warbar.open{transform:translateX(0)}
#wb-head{display:flex;align-items:flex-start;gap:4px;padding:10px 12px;border-bottom:1px solid var(--line)}
#wb-title{flex:1;min-width:0}
#wb-title h2{font-size:17px;font-weight:600;letter-spacing:1px;font-family:var(--serif);color:var(--txt)}
#wb-title .sub{font-family:var(--mono);font-size:10px;color:var(--dim);letter-spacing:1px;margin-top:2px}
#wb-close{font-family:var(--mono);font-size:14px;color:var(--dim);padding:4px 8px;border:1px solid var(--line2)}
#wb-close:hover{color:var(--gold);border-color:var(--gold)}
#wb-body{flex:1;overflow-y:auto;overscroll-behavior:contain;padding:12px;scrollbar-width:thin;scrollbar-color:var(--line2) transparent}
#wb-body::-webkit-scrollbar{width:6px}
#wb-body::-webkit-scrollbar-thumb{background:var(--line2)}
.wb-scale{display:flex;gap:3px;margin-bottom:12px}
.wb-scale span{flex:1;text-align:center;font-family:var(--mono);font-size:9px;color:var(--faint);
  border:1px solid var(--line);padding:4px 0;letter-spacing:0}
.wb-scale span i{display:block;font-style:normal;font-size:13px;font-weight:700;margin-bottom:1px;color:var(--dim)}
.wb-scale span.on{border-color:var(--gold);color:var(--txt)}
.wb-scale span.on i{color:var(--gold)}
.wcard{border:1px solid var(--line);background:rgba(14,20,26,.5);margin-bottom:10px;padding:9px 10px}
.wc-t{font-family:var(--serif);font-size:14px;font-weight:600;color:var(--txt);letter-spacing:.5px;
  display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.wc-since{font-family:var(--mono);font-size:9px;color:var(--dim);font-weight:400;flex:none}
.wc-vs{display:flex;align-items:stretch;gap:6px;margin-top:8px}
.wf{flex:1;min-width:0}
.wf-name{font-family:var(--mono);font-size:11px;color:var(--steelhi);cursor:pointer;padding:4px 6px;
  border:1px solid var(--line);user-select:none;display:flex;align-items:center;justify-content:space-between;gap:4px}
.wf-name:hover{border-color:var(--gold)}
.wf.R .wf-name{flex-direction:row-reverse;text-align:right}
.wf-name .n-caret{font-style:normal;font-size:9px;color:var(--dim);transition:transform .15s}
.wf.open .wf-name .n-caret{transform:rotate(90deg);color:var(--gold)}
.wf-flags{display:none;flex-wrap:wrap;gap:4px;padding:6px 2px 0}
.wf.open .wf-flags{display:flex}
.wf-m{display:inline-flex;align-items:center;gap:3px}
.wf-m .wf-f{width:20px;height:14px;object-fit:cover;border:1px solid rgba(255,255,255,.15);display:block}
.wf-m .wf-e{font-style:normal;font-size:15px;line-height:1}
.wf-m em{font-style:normal;font-family:var(--mono);font-size:8px;color:var(--faint)}
.wf-m.chip{font-family:var(--mono);font-size:10px;color:var(--txt);border:1px solid var(--line2);padding:2px 6px}
.wc-x{flex:none;align-self:center;font-family:var(--mono);font-size:10px;color:#a63d2e;letter-spacing:1px}
.wc-note{font-size:11px;color:var(--dim);line-height:1.7;margin-top:8px;border-top:1px dashed var(--line);padding-top:6px}
.wc-src{font-family:var(--mono);font-size:9px;color:var(--faint);margin-top:4px;line-height:1.6}

.leader{display:flex;gap:12px;align-items:center;margin-bottom:12px}
.leader .ph{width:74px;height:88px;flex:none;border:1px solid var(--line2);background:var(--panel) center/cover no-repeat;position:relative}
.leader .ph.fallback{display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:22px;color:var(--gold)}
.leader .who{min-width:0}
.leader .who .nm{font-size:15px;font-weight:600;font-family:var(--serif);letter-spacing:.5px}
.leader .who .tt{font-size:11px;color:var(--gold);font-family:var(--mono);margin-top:2px}
.leader .who .sn{font-size:10px;color:var(--dim);font-family:var(--mono);margin-top:3px}

.sec{margin:12px 0 4px}
.sec-t{font-family:var(--mono);font-size:10px;letter-spacing:2px;color:var(--dim);display:flex;align-items:center;gap:8px;margin-bottom:6px}
.sec-t::after{content:"";flex:1;height:0;border-top:1px dashed #2b3a44}
.kv{display:grid;grid-template-columns:64px 1fr;gap:4px 10px;font-size:12px}
.kv dt{color:var(--faint);font-family:var(--mono);font-size:10px;letter-spacing:1px;padding-top:2px}
.kv dd{color:var(--txt)}

/* Political-system hover explanations */
.tip{position:relative;border-bottom:1px dotted var(--dim);cursor:help}
.tip .tip-q{font-style:normal;font-family:var(--mono);font-size:9px;color:var(--gold);
  border:1px solid rgba(201,168,76,.5);padding:0 3px;margin-left:5px;vertical-align:1px}
.tip::after{content:attr(data-tip);position:absolute;left:0;bottom:calc(100% + 7px);z-index:60;
  width:min(300px,74vw);background:#10161d;border:1px solid var(--line2);border-left:2px solid var(--gold);
  padding:8px 10px;font-size:11px;line-height:1.55;color:var(--txt);letter-spacing:0;
  opacity:0;pointer-events:none;transition:opacity .15s;white-space:normal;font-family:var(--sans)}
.tip:hover::after{opacity:1}

.pie-row{display:flex;gap:12px;align-items:center}
.pie-row svg{flex:none}
.pie-lg{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.pie-lg .pi{display:flex;align-items:center;gap:6px;font-size:11px}
.pie-lg .pi i{width:8px;height:8px;flex:none}
.pie-lg .pi b{margin-left:auto;font-family:var(--mono);font-weight:400;color:var(--dim)}
.trd{font-family:var(--mono);font-size:9px;letter-spacing:-1px}
.trd.u{color:#c2593a}
.trd.d{color:#4c98a3}
.trd.f{color:#346970}

/* Politics: country-specific parliament diagrams compress seats proportionally while text retains actual counts. */
.parl-card{--pa:#5aa7b1;--pb:#536d7b;position:relative;overflow:hidden;margin:3px 0 2px;padding:9px 9px 8px;border:1px solid color-mix(in srgb,var(--pa) 55%,var(--line2));background:linear-gradient(135deg,color-mix(in srgb,var(--pa) 12%,#0d1319),rgba(11,16,22,.94));box-shadow:inset 3px 0 0 var(--pa),inset 0 1px rgba(255,255,255,.035)}
.parl-card:before{content:"";position:absolute;inset:0;pointer-events:none;opacity:.42;background:repeating-linear-gradient(90deg,transparent 0 18px,color-mix(in srgb,var(--pa) 28%,transparent) 19px 20px,transparent 21px 39px)}
.parl-card>*{position:relative;z-index:1}
.parl-top{display:flex;align-items:baseline;gap:8px;padding-bottom:5px;border-bottom:1px solid color-mix(in srgb,var(--pa) 45%,transparent)}
.parl-kicker{font-family:var(--mono);font-size:9px;letter-spacing:1.15px;color:var(--pa);white-space:nowrap}
.parl-name{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-family:var(--serif);font-size:14px;color:var(--txt);font-weight:700}
.parl-status{display:flex;justify-content:space-between;gap:8px;margin:5px 0 4px;font-family:var(--mono);font-size:9px;letter-spacing:.45px;color:var(--dim)}
.parl-status b{font-weight:400;color:var(--pa);text-align:right;white-space:nowrap}
.parl-heritage{display:flex;gap:6px;align-items:baseline;margin:-1px 0 5px;font-family:var(--mono);font-size:8px;letter-spacing:.45px;color:var(--faint)}.parl-heritage span{color:color-mix(in srgb,var(--pa) 76%,#bed2d6)}.parl-heritage b{font-weight:400;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.parl-one,.parl-us{margin:1px 0 2px}.parl-us{display:flex;gap:8px}.parl-us .pu{flex:1;min-width:0}
.pu-t{font-family:var(--mono);font-size:9px;color:var(--dim);letter-spacing:.65px;margin-bottom:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.parl-svg{width:100%;height:auto;display:block}.parl-us .parl-svg{min-height:67px}
.parl-lg{display:flex;flex-wrap:wrap;gap:3px 9px;margin-top:6px}.parl-lg .pi{display:flex;align-items:center;gap:5px;font-size:10px;line-height:1.25}.parl-lg .pi i{width:7px;height:7px;flex:none}.parl-lg .pi b{font-family:var(--mono);font-weight:400;color:var(--dim)}
.parl-note{font-family:var(--mono);font-size:8.5px;color:var(--faint);margin-top:5px;letter-spacing:.35px;line-height:1.5}
.parl-card.theme-westminster{--pa:#5ba8b2;--pb:#ad3842;background:linear-gradient(135deg,#0c191e,#0d1319 60%)}.parl-card.theme-westminster:before{background:repeating-linear-gradient(0deg,transparent 0 8px,rgba(187,155,82,.13) 9px 10px,transparent 11px 19px)}
.parl-card.theme-capitol{--pa:#bf4946;--pb:#4f87bf;background:linear-gradient(115deg,#172536,#0d1319 58%,#30171a)}.parl-card.theme-capitol:before{background:radial-gradient(ellipse at 50% 112%,rgba(191,73,70,.22),transparent 47%),repeating-linear-gradient(90deg,transparent 0 12px,rgba(255,255,255,.045) 13px 14px)}
.parl-card.theme-congress{--pa:#d44a3f;--pb:#c89a38;background:linear-gradient(135deg,#2a1517,#11171b 65%)}.parl-card.theme-congress:before{background:repeating-radial-gradient(ellipse at 50% 115%,transparent 0 15px,rgba(212,74,63,.16) 16px 17px,transparent 18px 29px)}
.parl-card.theme-kremlin{--pa:#cb5545;--pb:#6b8090;background:linear-gradient(135deg,#251719,#10171d)}.parl-card.theme-kremlin:before{background:repeating-linear-gradient(90deg,rgba(203,85,69,.11) 0 1px,transparent 1px 21px)}
.parl-card.theme-euro{--pa:#d1b24f;--pb:#54799a;background:linear-gradient(135deg,#10202a,#0d1319 62%,#112128)}.parl-card.theme-euro:before{background:radial-gradient(circle at 15% 12%,rgba(209,178,79,.18) 0 1px,transparent 2px) 0 0/17px 17px}
.parl-card.theme-pacific{--pa:#d1524b;--pb:#d1dfe2;background:linear-gradient(135deg,#1b202a,#0d1319 68%)}.parl-card.theme-pacific:before{background:repeating-linear-gradient(45deg,transparent 0 14px,rgba(209,82,75,.13) 15px 16px)}
.parl-card.theme-federal{--pa:#4e9ba5;--pb:#d0a63d;background:linear-gradient(135deg,#10211f,#0d1319 62%,#112229)}.parl-card.theme-federal:before{background:repeating-linear-gradient(90deg,transparent 0 22px,rgba(79,164,132,.16) 23px 24px)}
.parl-card.theme-crisis{--pa:#c66143;--pb:#71859a;background:linear-gradient(135deg,#251917,#0d1319 60%)}.parl-card.theme-crisis:before{background:repeating-linear-gradient(135deg,transparent 0 8px,rgba(198,97,67,.13) 9px 10px)}
.parl-card.theme-council{--pa:#ceaa47;--pb:#497b78;background:linear-gradient(135deg,#112128,#0d1319 64%)}.parl-card.theme-council:before{background:repeating-linear-gradient(0deg,transparent 0 11px,rgba(206,170,71,.13) 12px 13px)}
.parl-card.theme-mosaic{--pa:#63acb6;--pb:#d49042;background:linear-gradient(135deg,#102026,#0d1319 60%)}.parl-card.theme-mosaic:before{background:linear-gradient(55deg,transparent 44%,rgba(112,169,130,.12) 45% 46%,transparent 47%),linear-gradient(-55deg,transparent 44%,rgba(212,144,66,.10) 45% 46%,transparent 47%);background-size:24px 24px}
.parl-card[data-iso="ISR"]{--pa:#5b94cb}.parl-card[data-iso="IRN"]{--pa:#4d99a3}.parl-card[data-iso="SAU"]{--pa:#c8a448}.parl-card[data-iso="EGY"]{--pa:#c58b4b}.parl-card[data-iso="TWN"]{--pa:#6d9bc9}.parl-card[data-iso="ZAF"]{--pa:#61abb4}.parl-card[data-iso="VEN"]{--pa:#c75348}
/* The second layer is a country's historical/cultural material, order, and decorative syntax, not merely a palette name. */
.parl-card[data-culture="anglo"]{background:linear-gradient(135deg,#251b17,#11161b 67%)}.parl-card[data-culture="anglo"]:before{background:repeating-linear-gradient(90deg,rgba(176,132,76,.12) 0 1px,transparent 1px 18px),repeating-linear-gradient(0deg,transparent 0 13px,rgba(176,132,76,.09) 14px 15px)}
.parl-card[data-culture="sinic"]{background:linear-gradient(135deg,#351519,#12161a 68%)}.parl-card[data-culture="sinic"]:before{background:repeating-linear-gradient(90deg,transparent 0 13px,rgba(213,69,56,.14) 14px 16px,transparent 17px 29px),repeating-linear-gradient(0deg,transparent 0 13px,rgba(202,157,55,.11) 14px 15px)}
.parl-card[data-culture="russian"]{background:linear-gradient(135deg,#28191a,#11161b 64%)}.parl-card[data-culture="russian"]:before{background:linear-gradient(45deg,transparent 46%,rgba(201,76,61,.14) 47% 48%,transparent 49%) 0 0/22px 22px,linear-gradient(-45deg,transparent 46%,rgba(201,76,61,.10) 47% 48%,transparent 49%) 0 0/22px 22px}
.parl-card[data-culture="republican"]{background:linear-gradient(135deg,#14233a,#11161b 65%,#2b1719)}.parl-card[data-culture="republican"]:before{background:linear-gradient(90deg,rgba(62,104,165,.20) 0 2px,transparent 2px calc(50% - 2px),rgba(211,69,60,.16) calc(50% - 2px) calc(50% + 2px),transparent calc(50% + 2px)),repeating-linear-gradient(0deg,transparent 0 10px,rgba(238,221,164,.06) 11px 12px)}
.parl-card[data-culture="bauhaus"]{background:linear-gradient(135deg,#172027,#10161a)}.parl-card[data-culture="bauhaus"]:before{background:linear-gradient(90deg,transparent 47%,rgba(213,178,79,.18) 48% 52%,transparent 53%),linear-gradient(0deg,transparent 47%,rgba(79,121,154,.14) 48% 52%,transparent 53%);background-size:30px 30px}
.parl-card[data-culture="mediterranean"]{background:linear-gradient(135deg,#13252d,#11161a 66%)}.parl-card[data-culture="mediterranean"]:before{background:repeating-linear-gradient(90deg,rgba(205,180,111,.13) 0 2px,transparent 2px 23px),linear-gradient(0deg,transparent 45%,rgba(205,180,111,.11) 46% 54%,transparent 55%)}

function parlTotal(g){return g.reduce(function(s,x){return s+x[1]},0)}
function scaledSeats(groups,total){
  var real=total||parlTotal(groups)||1,shown=Math.max(30,Math.min(176,Math.round(Math.sqrt(real)*4.3))),raw=groups.map(function(x){return x[1]/real*shown}),n=raw.map(Math.floor),left=shown-n.reduce(function(a,b){return a+b},0);

  return groups.map(function(x,i){return [x[0],n[i],x[2],x[1]]});

/* Politics: parliamentary semicircular sector chart */
function hemiSVG(groups, total){
  groups=scaledSeats(groups,total); total=parlTotal(groups);
  var W=240, H=132, cx=W/2, cy=H-8;
  var rows = total<=110?4 : total<=260?5 : total<=600?7 : 10;
  var R=Math.min(cx-8, cy-4), rIn=R*0.40;
  var radii=[], lens=[], sum=0, i, j;
  for(i=0;i<rows;i++){var r=rows===1?R:rIn+i*(R-rIn)/(rows-1);radii.push(r);var L=Math.PI*r;lens.push(L);sum+=L;}
  var raw=lens.map(function(L){return L/sum*total});
  var counts=raw.map(function(v){return Math.floor(v)});
  var rem=total-counts.reduce(function(a,b){return a+b},0);
  var frac=raw.map(function(v,ix){return [v-Math.floor(v),ix]}).sort(function(a,b){return b[0]-a[0]});
  for(i=0;i<rem;i++) counts[frac[i][1]]++;
  var dots="", gi=0, used=0;
  for(i=0;i<rows;i++){
    var n=counts[i]; if(!n) continue;
    var rr=radii[i];
    var dr=Math.max(0.8, Math.min(Math.PI*rr/n*0.34, (rows>1?(R-rIn)/(rows-1):R)*0.38, 3.4));
    for(j=0;j<n;j++){
      var a=Math.PI+(j+0.5)*(Math.PI/n);
      var x=cx+rr*Math.cos(a), y=cy+rr*Math.sin(a);
      while(gi<groups.length-1 && used>=groups[gi][1]){gi++;used=0;}
      var col=groups[gi]?groups[gi][2]:"#3a3d42";
      used++;
      dots+='<circle cx="'+x.toFixed(1)+'" cy="'+y.toFixed(1)+'" r="'+dr.toFixed(1)+'" fill="'+col+'"/>';
    }
  }
  return '<svg class="parl-svg" viewBox="0 0 '+W+' '+H+'" aria-hidden="true">'+dots+'</svg>';
}

/* Hatching (occupation), dots (activity), crosshatching (contested) distinguish armed control from ordinary country fills. */
function zonePattern(col, kind){

  var g = cv.getContext("2d");

function linePath(geom){

      var c = polys[i][j][k];

/* Pure political-color logic for a country under current mode/selection/data, shared by compositor and tests. */

   Map data triples the world at -360°/0°/+360°. Crossing ±180° shifts the center by one world;
   identical copies make this jump invisible. Zoom never falls below viewport fill. */
function worldRectPx(){
  var p0 = chart.convertToPixel({geoIndex:0}, [-180, 90]);
  var p1 = chart.convertToPixel({geoIndex:0}, [180, -90]);
  return {x0:p0[0], y0:p0[1], x1:p1[0], y1:p1[1]};
}
/* Invert the current view center in view units: px = (GEO_C - c)*ppu + L */
function viewCenterVU(){
  var el = document.getElementById("map");
  var W = el.clientWidth, H = el.clientHeight;
  var r = worldRectPx();
  var ppuX = (r.x1-r.x0)/GEO_SX, ppuY = (r.y1-r.y0)/GEO_SY;
  var wcx = (r.x0+r.x1)/2, wcy = (r.y0+r.y1)/2;
  return { x: GEO_CX - (wcx - W/2)/ppuX,
           y: GEO_CY + (wcy - H*0.51)/ppuY,
           ppuX: ppuX, ppuY: ppuY, r: r, W: W, H: H };
}
var roamClampTimer;
function scheduleRoamClamp(){clearTimeout(roamClampTimer);roamClampTimer=setTimeout(clampRoam,140);}
function clampRoam(){
  if(!chart || !chart.getOption || !chart.convertToPixel) return;
  var el = document.getElementById("map"); if(!el) return;
  var W = el.clientWidth, H = el.clientHeight; if(!W || !H) return;
  /* 1) Minimum zoom makes one world fill the viewport, calculated dynamically */
  var geoModel=chart.getModel().getComponent("geo");
  var g0=geoModel.option;
  var z = g0.zoom || 1;
  var r0 = worldRectPx();
  var wPerZ = (r0.x1-r0.x0)/z, hPerZ = (r0.y1-r0.y0)/z;
  if(!(wPerZ>0 && hPerZ>0)) return;
  var need = Math.max(2.0, W/wPerZ, H/hPerZ);
  var lim = g0.scaleLimit || {};
  var upd = {};
  if(Math.abs((lim.min||0)-need) > 0.02) upd.scaleLimit = {min:need, max:need*6.4};
  if(z < need*0.99) upd.zoom = need;
  if(upd.zoom || upd.scaleLimit) chart.setOption({geo:upd});
  /* 2) Horizontal wrapping: crossing ±180° shifts by one world, or 270 view units */
  var v = viewCenterVU();
  var centerLon = -180 + (v.W/2 - v.r.x0)/((v.r.x1-v.r.x0)/360);
  if(centerLon > 180 || centerLon < -180){
    chart.setOption({geo:{center:[v.x + (centerLon>180 ? -270 : 270), v.y]}});
    v = viewCenterVU();
  }
  /* 3) Instant vertical clamping: neither north nor south edge may enter the viewport */
  var h = v.r.y1 - v.r.y0, dy = 0;
  if(h <= v.H){ dy = (v.H-h)/2 - v.r.y0; }
  else if(v.r.y0 > 0){ dy = -v.r.y0; }
  else if(v.r.y1 < v.H){ dy = v.H - v.r.y1; }
  if(dy) chart.setOption({geo:{center:[v.x, v.y + dy/v.ppuY]}});
}
/* ---------- Tripled world: copy geojson at -360°/0°/+360° for horizontal wrapping ---------- */
function shiftCoords(c, dx){
  if(typeof c[0]==="number") return [c[0]+dx, c[1]];
  var out = [];
  for(var i=0;i<c.length;i++) out.push(shiftCoords(c[i], dx));
  return out;
}
function world3x(){
  var feats = (window.WORLD_GEOJSON||{}).features || [];
  var out = {type:"FeatureCollection", features:[]};
  for(var k=-1;k<=1;k++){
    feats.forEach(function(f){
      /* Rename copies because name is echarts' primary key; duplicate names are deduplicated and corrupt bounding boxes.
         Keep the central original name; use #W/#E for left/right copies and strip at # for dossier lookup. */
      var props = {};
      if(f.properties) for(var key in f.properties) props[key] = f.properties[key];
      if(k!==0 && props.name) props.name = props.name + (k<0 ? "#W" : "#E");
      out.features.push({type:"Feature", properties:props,
        geometry: f.geometry ? {type:f.geometry.type, coordinates:shiftCoords(f.geometry.coordinates, k*360)} : null});
    });

function setMode(b){
  if(!b || !b.dataset || !b.dataset.mode) return;
  if(state.mode===b.dataset.mode && !state.sel && !state.selAlliance) return;
  document.querySelectorAll(".modes button").forEach(function(x){

    x.classList.toggle("on", on);
    x.setAttribute("aria-pressed", on?"true":"false");
  });
  state.mode = b.dataset.mode;
  state.sel = null;
  state.selAlliance = null;
  document.getElementById("sidebar").classList.remove("open");
  renderMap();
}

function openPaperLegacy(iso, ix){
  var it = newsOf(iso)[ix];

  var paras = String(it.full).split(/\n\n+/).map(function(s){
    return "<p>"+esc(s.replace(/\n/g," "))+"</p>";
  }).join("");
  var h = '<button class="pp-back" aria-label="关闭">◀</button>'+
    '<div class="pp-frame">'+
    '<div class="pp-mast"><span class="pp-ear'+earCls+'">'+esc(p[1])+'</span>'+
      '<span class="pp-name '+p[3]+'">'+esc(p[0])+'</span>'+
      '<span class="pp-ear r">'+esc(earR)+'</span></div>'+ 
    '<div class="pp-mastrule"></div>'+
    '<div class="pp-title">'+esc(it.t||"")+'</div>'+
    '<div class="pp-by"><span class="pp-sec">'+esc(cname(iso))+'</span><span>'+esc(it.src||"WIRE")+'</span><span>'+esc(fmtTime(it.pub||""))+'</span><span class="pp-lang">'+(it.full_lang==="en"?"原文":"中文全文")+'</span></div>'+
    (it.img
      ? '<div class="pp-body"><div class="pp-imgcol"><img src="'+esc(it.img)+'" alt=""></div>'+
        '<div class="pp-maincol"><div class="pp-textcol">'+paras+'</div>'+ 
        '<div class="pp-foot"><button class="pp-opt" type="button" title="关闭(Esc)">'+esc(kicker)+'</button></div></div></div>'
      : '<div class="pp-textcol">'+paras+'</div>'+

    '</div>';

function paperDate(s){
  var d = s ? new Date(s) : null;
  if(!d || isNaN(d.getTime())) return "WORLD DESK";
  return d.toLocaleDateString("en-GB",{day:"2-digit",month:"short",year:"numeric"}).toUpperCase();
}
function paperImageURL(src){
  /* Published photographs are already sized and verified by the collector. */
  return String(src||"");
}
function openPaper(iso, ix){
  var it = newsOf(iso)[ix];
  if(!it) return;
  var src = it.src || it.source || "WIRE";
  var m = SOURCE_MASTHEADS[src] || {display:src,asset:"",style:"mast-serif"};
  var hasFull = !!it.full;
  var copy = hasFull ? String(it.full) : String(it.s || "本文尚未抓取，点击下方链接阅读原文。");
  var paras = copy.split(/\n\n+/).filter(function(s){
    return !/^(?:our privacy (?:notice|statement|policy)\s*(?:and|&)\s*cookies? policy|by continuing to (?:browse|use|visit) (?:our|this|the) (?:website|site)|we use cookies (?:to|on)|我们(?:的)?隐私(?:声明|政策|通知)\s*(?:和|与|及)\s*cookie\s*政策|继续浏览我们的网站即表示|继续(?:浏览|使用)(?:我们|本)的网站.{0,40}(?:cookie|隐私))/i.test(s.trim());
  }).map(function(s){
    return "<p"+(hasFull?"":" class=\"pp-summary\"")+">"+esc(s.replace(/\n/g," "))+"</p>";
  }).join("");
  var originalImg = String(it.img||"");
  var defaultImg = "assets/tno-report-event-fallback.png";
  var imgURL = originalImg ? paperImageURL(originalImg) : defaultImg;
  var img = '<div class="pp-imgcol"><img class="'+(originalImg?"":"pp-fallback")+'" src="'+esc(imgURL)+'" data-fallback="'+esc(originalImg)+'" data-default="'+defaultImg+'" alt="" loading="eager" onerror="if(this.dataset.fallback){this.src=this.dataset.fallback;this.dataset.fallback=\'\'}else if(!this.dataset.defaultUsed){this.dataset.defaultUsed=\'1\';this.classList.add(\'pp-fallback\');this.src=this.dataset.default}else{this.style.display=\'none\'}"></div>';
  var kicker = "阅毕";
  var body = '<div class="pp-body">'+img+
    '<div class="pp-maincol"><div class="pp-textcol">'+paras+'</div>'+ 
    '<div class="pp-foot"><button class="pp-opt" type="button" title="返回情报栏（Esc）">'+esc(kicker)+'</button></div></div></div>';
  var h = '<button class="pp-back" aria-label="关闭">◀</button><div class="pp-frame">'+
    '<div class="pp-head"><div class="pp-mast">'+(m.asset?'<img class="pp-orn" src="'+esc(m.asset)+'" alt="">':"")+'<span class="pp-name '+esc(m.style)+'">'+esc(m.display)+'</span></div><div class="pp-title">'+esc(it.t||it.t0||"")+'</div>'+ 
    '<div class="pp-by"><span class="pp-sec">'+esc(src)+'</span><span>'+esc(cname(iso))+'</span><span>'+esc(paperDate(it.pub))+'</span></div></div>'+body+
    '</div>';
  var el = document.getElementById("paper");
  el.innerHTML = h; el.classList.add("show");
  el.classList.remove('paper-wide');
  var photo = el.querySelector('.pp-imgcol img');
  function choosePaperFrame(){
    el.classList.toggle('paper-wide',!!(photo && !photo.classList.contains('pp-fallback') && photo.naturalWidth > photo.naturalHeight));
  }
  if(photo){photo.addEventListener('load',choosePaperFrame);if(photo.complete)choosePaperFrame();}
  var textcol = el.querySelector(".pp-textcol"); if(textcol) textcol.scrollTop = 0;
  var stage = document.getElementById("paper-stage");
  stage.classList.add("show"); stage.setAttribute("aria-hidden","false");
  document.getElementById("paper-back").classList.add("show");
}
function closePaper(){
  document.getElementById("paper-back").classList.remove("show");
  document.getElementById("paper-stage").classList.remove("show");
  document.getElementById("paper-stage").setAttribute("aria-hidden","true");
  document.getElementById("paper").classList.remove("show");
}
document.getElementById("paper-back").addEventListener("click", closePaper);
document.getElementById("paper").addEventListener("click", function(e){
  if(e.target.closest(".pp-back")){ closePaper(); return; }
  if(e.target.closest(".pp-opt")) closePaper();
});

document.getElementById("sb-body").addEventListener("click", function(e){
  var chip = e.target.closest && e.target.closest("[data-open-paper]");
  if(chip){
    var chipLi = chip.closest("#news-list li");
    if(chipLi && state.sel){ openPaper(state.sel, +chipLi.dataset.ix); return; }
  }
  var a = e.target.closest && e.target.closest("a.n-link, a.n-t");
  if(a){ e.preventDefault(); openExt(a.getAttribute("href")); return; }
  if(e.target.closest("a")) return;
  var rs = e.target.closest && e.target.closest(".rs");
  if(rs){ rs.classList.toggle("open"); return; }
  var li = e.target.closest("#news-list li");
  if(!li) return;
  var it = state.sel ? newsOf(state.sel)[+li.dataset.ix] : null;
  if(it && it.full){ openPaper(state.sel, +li.dataset.ix); return; }
  if(li.classList.contains("xp")) li.classList.toggle("open");
});

function toggleWarbar(force){
  var wb = document.getElementById("warbar");

}

/* Drag the sidebar's right edge horizontally to resize; persist width in localStorage. */
(function(){
  var sb = document.getElementById("sidebar"), rz = document.getElementById("sb-resizer");
  if(!sb || !rz) return;
  function clampW(w){ return Math.max(280, Math.min(w, 620, (window.innerWidth||1200)*0.92)); }
  try{
    var saved = window.localStorage.getItem("geo_sb_w");
    if(saved) sb.style.width = clampW(parseInt(saved,10)||0) + "px";
  }catch(e){}
  rz.addEventListener("pointerdown", function(e){
    e.preventDefault();
    sb.classList.add("dragging");
    var startX = e.clientX, startW = sb.getBoundingClientRect().width;
    function mv(ev){ sb.style.width = clampW(startW + ev.clientX - startX) + "px"; }
    function up(){
      sb.classList.remove("dragging");
      document.removeEventListener("pointermove", mv);
      document.removeEventListener("pointerup", up);
      try{ window.localStorage.setItem("geo_sb_w", String(Math.round(sb.getBoundingClientRect().width))); }catch(e2){}
    }
    document.addEventListener("pointermove", mv);
    document.addEventListener("pointerup", up);
  });
})();
document.addEventListener("keydown", function(e){ if(e.key==="Escape"){
  if(document.getElementById("paper").classList.contains("show")){ closePaper(); return; }
